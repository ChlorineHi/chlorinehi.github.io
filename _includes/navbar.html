<header class="site-header">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %} header-inner">
        <div class="navleft text">
            <a href="{{ '/' | relative_url }}">{% if page.lang == "zh" %}{{site.data.profile_zh.navbar_name}}{% else %}{{site.data.profile.navbar_name}}{% endif %}</a>
        </div>
        <div class="navright-group">
            {% for item in site.data.navigation.pages %}
            <div class="navright text {% if item.name == page.navbar_title or include.active_page == item.name %}active{% endif %}">
                <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
            </div>
            {% endfor %}
            <div class="navright text">
                <a href="#" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
                    <i id="theme-icon" class="fas fa-moon"></i>
                </a>
            </div>
            <div class="navright text">
                {% if page.lang == "zh" %}
                <a href="{{ '/' | relative_url }}"><i class="fas fa-language"></i> EN</a>
                {% else %}
                <a href="{{ '/zh/' | relative_url }}"><i class="fas fa-language"></i> 中</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
